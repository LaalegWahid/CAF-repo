<svg xmlns="http://www.w3.org/2000/svg" width="640" height="720" viewBox="0 0 640 720" role="img" aria-label="Portrait du dirigeant du cabinet CAF (image de marque provisoire)">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#123049"/>
      <stop offset="1" stop-color="#0b2233"/>
    </linearGradient>
    <linearGradient id="floor" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1a9dd9" stop-opacity="0"/>
      <stop offset="1" stop-color="#1a9dd9" stop-opacity="0.22"/>
    </linearGradient>
    <clipPath id="card"><rect x="0" y="0" width="640" height="720" rx="28"/></clipPath>
  </defs>

  <g clip-path="url(#card)">
    <rect width="640" height="720" fill="url(#bg)"/>

    <!-- subtle mosaic motif echoing the logo -->
    <g fill="#ffffff" opacity="0.05">
      <rect x="70"  y="90"  width="34" height="34" rx="7" transform="rotate(45 87 107)"/>
      <rect x="150" y="60"  width="24" height="24" rx="5" transform="rotate(45 162 72)"/>
      <rect x="520" y="120" width="40" height="40" rx="8" transform="rotate(45 540 140)"/>
      <rect x="560" y="220" width="24" height="24" rx="5" transform="rotate(45 572 232)"/>
      <rect x="40"  y="300" width="24" height="24" rx="5" transform="rotate(45 52 312)"/>
    </g>

    <rect x="0" y="470" width="640" height="250" fill="url(#floor)"/>

    <!-- head & shoulders silhouette (placeholder for a real photo) -->
    <g fill="#9fb8c9" opacity="0.9">
      <circle cx="320" cy="300" r="96"/>
      <path d="M150 620c0-104 76-186 170-186s170 82 170 186v40H150z"/>
    </g>
    <g fill="#123049" opacity="0.25">
      <circle cx="320" cy="300" r="96"/>
    </g>

    <!-- the company logo as a corner badge -->
    <g transform="translate(452 500)">
      <circle cx="72" cy="72" r="72" fill="#ffffff"/>
      <image x="20" y="20" width="104" height="104" href="data:image/png;base64,"/>
    </g>

    <!-- brand wordmark -->
    <text x="56" y="112" font-family="Segoe UI, Arial, sans-serif" font-size="30" font-weight="700" fill="#ffffff">CAF</text>
    <text x="56" y="140" font-family="Segoe UI, Arial, sans-serif" font-size="16" fill="#9fb8c9" letter-spacing="1.5">EXPERTISE SOCIALE &amp; AUDIT</text>

    <rect x="0" y="0" width="640" height="720" rx="28" fill="none" stroke="#ffffff" stroke-opacity="0.12" stroke-width="2"/>
  </g>
</svg>
